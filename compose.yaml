services:
  pipeline:
    image: ${CAPSTONE_IMAGE:-group4-capstone:local}
    build: .
    command: [python, -m, capstone, run]
    volumes:
      - model-state:/app/state
      - report-data:/app/reports
    profiles: [jobs]
  api:
    image: ${CAPSTONE_IMAGE:-group4-capstone:local}
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - model-state:/app/state:ro
    restart: unless-stopped
  mlflow:
    image: ${CAPSTONE_IMAGE:-group4-capstone:local}
    command: [mlflow, server, --backend-store-uri, "sqlite:////app/state/mlflow.db", --host, "0.0.0.0", --port, "5000", --allowed-hosts, "localhost:5000,127.0.0.1:5000,mlflow:5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - model-state:/app/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/capstone.json:ro
    depends_on: [prometheus]
volumes:
  model-state:
  report-data:
