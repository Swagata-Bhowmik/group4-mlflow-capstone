services:
  - type: web
    name: group4-mlflow-capstone
    runtime: docker
    plan: free
    repo: https://github.com/Swagata-Bhowmik/group4-mlflow-capstone
    branch: main
    # GitHub Actions triggers the exact passing commit through the Render API.
    autoDeployTrigger: off
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
